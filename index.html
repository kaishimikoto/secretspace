<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Secret Space</title>
        <link rel="stylesheet" href="e-card.css">
        <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Geist+Pixel&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    </head>
    <body>
        <!-- LOGIN GATE -->
        <div id="login-wrapper">
            <form id="login-form" action="#">
                <div id="login-screen">
                    <div class="login-title">
                        <h3>Hello!</h3>
                        <p>Welcome to Irish's Space</p>
                    </div>

                    <div class="form-fields">
                        <div class="name-field">
                            <label for="name">Name:</label>
                            <input 
                            type="text" 
                            id="name" 
                            name="name"
                            autocomplete="off"
                            placeholder="Enter your name" 
                            required>

                        </div>
                        <div class="password-field">
                            <label for="password">Password:</label>
                            <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Enter the code" 
                            required>
                        </div>

                        <div class="btn-container">
                            <button class="login-btn" type="submit">Enter Space</button>
                            <div id="error-msg">Hmmm... wrong code! Try again. </div>
                        </div>
                    </div><!--form fields-->
                </div><!--login screen-->
            </form>
        </div>

        <!-- CHALKBOARD -->
         <div id="chalkboard">
            <div class="notes-grid">
                <div class="note" data-id="0" title="Open Note 1">Note 1</div>
                <div class="note" data-id="1" title="Open Note 2">Note 2</div>
                <div class="note" data-id="2" title="Open Note 3">Note 3</div>
                <div class="note" data-id="3" title="Open Note 4">Note 4</div>
                <div class="note" data-id="4" title="Open Note 5">Note 5</div>
                <div class="note" data-id="5" title="Open Note 6">Note 6</div>
            </div>
        </div>

        <!--POP UP NOTE MODAL-->
        <div id="note-modal">
            <div class="popup-note-card" id="popup-note-card">
                <div>
                    <div class="note-title" id="modal-title"></div>
                    <div class="note-text" id="modal-text"></div>
                </div>
                <div class="close-hint">Click anywhere to return to board</div>
            </div>
        </div>
        <script src="e-card.js"></script>
    </body>
</html>
